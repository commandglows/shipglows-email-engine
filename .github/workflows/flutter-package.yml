name: Flutter package

on:
  push:
    paths:
      - "packages/source_sidebar_flutter/**"
      - "packages/newsletter_studio_flutter/**"
      - "packages/shipglows_flutter_zoom/**"
      - "app/**"
      - "demo/**"
      - "scripts/vercel-build.sh"
      - "vercel.json"
      - ".github/workflows/flutter-package.yml"
  pull_request:
    paths:
      - "packages/source_sidebar_flutter/**"
      - "packages/newsletter_studio_flutter/**"
      - "packages/shipglows_flutter_zoom/**"
      - "app/**"
      - "demo/**"
      - "scripts/vercel-build.sh"
      - "vercel.json"
      - ".github/workflows/flutter-package.yml"

permissions:
  contents: read

jobs:
  newsletters:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [packages/newsletter_studio_flutter, app]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - if: matrix.directory == 'app'
        run: flutter build web --release --base-href /email-engine/
      - if: matrix.directory == 'app'
        uses: actions/upload-artifact@v4
        with:
          name: email-engine-web
          path: app/build/web
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/source_sidebar_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test
            git diff --exit-code -- lib test
          fi
      - run: flutter analyze
      - run: flutter test

  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            dart format lib test
            git diff --exit-code -- lib test
          fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
